<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")</script>
<title>Quizz Copas – Copa do Mundo 2022</title>
<style>
  :root {
    --bg1: #0b6e4f; --bg2: #08415c; --card: #fff; --text: #1b1b1b; --title: #08415c;
    --muted: #666; --track: #e4e9ec; --accent: #0b6e4f; --accent-hover: #09593f;
    --border: #d5dde2; --opt-bg: #fff; --opt-hover: #f1faf6;
    --ok-border: #1a9d5a; --ok-bg: #dff6e9; --bad-border: #d64545; --bad-bg: #fde5e5;
  }
  [data-theme="dark"] {
    --bg1: #07281f; --bg2: #061b29; --card: #1c2430; --text: #e8edf2; --title: #8fd3b6;
    --muted: #a3afbc; --track: #34404f; --accent: #2fb985; --accent-hover: #4ccf9d;
    --border: #3b4757; --opt-bg: #242e3b; --opt-hover: #2b3a47;
    --ok-border: #3ec783; --ok-bg: #17402e; --bad-border: #ef6b6b; --bad-bg: #4a2327;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; color: var(--text);
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    padding: 16px;
  }
  .card {
    position: relative; background: var(--card); width: 100%; max-width: 640px; border-radius: 16px;
    padding: 28px; box-shadow: 0 12px 40px rgba(0,0,0,.35); transition: background .2s;
  }
  .theme-toggle {
    position: absolute; top: 16px; right: 16px; padding: 6px 12px; font-size: .85rem;
    border: 2px solid var(--border); border-radius: 20px; background: var(--opt-bg);
    color: var(--text); cursor: pointer;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  h1 { margin: 0 0 4px; font-size: 1.6rem; color: var(--title); }
  .sub { margin: 0 0 20px; color: var(--muted); }
  .progress { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .counter { font-size: .85rem; color: var(--muted); margin-bottom: 16px; }
  .question { font-size: 1.25rem; font-weight: 600; margin-bottom: 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    text-align: left; font-size: 1rem; padding: 12px 14px; border: 2px solid var(--border);
    border-radius: 10px; background: var(--opt-bg); color: var(--text); cursor: pointer; transition: .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: var(--opt-hover); }
  .option:disabled { cursor: default; }
  .option.correct { border-color: var(--ok-border); background: var(--ok-bg); }
  .option.wrong { border-color: var(--bad-border); background: var(--bad-bg); }
  .feedback { min-height: 24px; margin: 14px 0 0; font-weight: 600; }
  .btn {
    margin-top: 16px; padding: 12px 22px; font-size: 1rem; font-weight: 600; border: 0;
    border-radius: 10px; background: #0b6e4f; color: #fff; cursor: pointer;
  }
  .btn:hover { background: #09593f; }
  [data-theme="dark"] .btn { background: #1f8f66; }
  [data-theme="dark"] .btn:hover { background: #26a577; }
  .hidden { display: none; }
  .result { text-align: center; }
  .score { font-size: 3rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
  .msg { font-size: 1.1rem; margin-bottom: 8px; }
</style>
</head>
<body>
<main class="card">
  <button class="theme-toggle" id="theme" type="button"></button>
  <h1 style="padding-right:110px">⚽ Quizz Copas</h1>
  <p class="sub">Copa do Mundo de futebol masculino – Catar 2022</p>

  <section id="quiz">
    <div class="progress"><div id="bar"></div></div>
    <div class="counter" id="counter"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <p class="feedback" id="feedback"></p>
    <button class="btn hidden" id="next">Próxima</button>
  </section>

  <section id="result" class="result hidden">
    <div class="score" id="score"></div>
    <p class="msg" id="msg"></p>
    <button class="btn" id="restart">Refazer o quiz</button>
  </section>
</main>

<script>
const questions = [
  { q: "Qual país sediou a Copa do Mundo de 2022?", options: ["Catar", "Rússia", "Emirados Árabes Unidos", "Arábia Saudita"], answer: 0 },
  { q: "Quem foi o campeão da Copa do Mundo de 2022?", options: ["França", "Argentina", "Croácia", "Marrocos"], answer: 1 },
  { q: "Qual foi o placar da final entre Argentina e França (após a prorrogação)?", options: ["2 x 1", "3 x 0", "3 x 3", "4 x 2"], answer: 2 },
  { q: "Como a Argentina venceu a final de 2022?", options: ["Gol de ouro na prorrogação", "Nos pênaltis (4 x 2)", "No tempo normal", "Nos pênaltis (5 x 4)"], answer: 1 },
  { q: "Quem foi o artilheiro da Copa de 2022, com 8 gols?", options: ["Lionel Messi", "Olivier Giroud", "Kylian Mbappé", "Julián Álvarez"], answer: 2 },
  { q: "Quem foi eleito o melhor jogador (Bola de Ouro) da Copa de 2022?", options: ["Lionel Messi", "Kylian Mbappé", "Luka Modrić", "Antoine Griezmann"], answer: 0 },
  { q: "Qual seleção africana chegou pela primeira vez a uma semifinal de Copa do Mundo em 2022?", options: ["Senegal", "Gana", "Camarões", "Marrocos"], answer: 3 },
  { q: "Qual seleção eliminou o Brasil nas quartas de final de 2022?", options: ["Croácia", "Argentina", "Holanda", "Marrocos"], answer: 0 },
  { q: "Quem ficou com o terceiro lugar na Copa de 2022?", options: ["Marrocos", "Inglaterra", "Croácia", "Holanda"], answer: 2 },
  { q: "Qual seleção venceu a Argentina na estreia, em uma das maiores zebras da Copa de 2022?", options: ["Arábia Saudita", "México", "Polônia", "Tunísia"], answer: 0 }
];

const $ = id => document.getElementById(id);
let order, current, score, answered;

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function start() {
  order = shuffle(questions.map((_, i) => i));
  current = 0; score = 0;
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  show();
}

function show() {
  answered = false;
  const item = questions[order[current]];
  $("counter").textContent = `Pergunta ${current + 1} de ${questions.length}`;
  $("bar").style.width = `${(current / questions.length) * 100}%`;
  $("question").textContent = item.q;
  $("feedback").textContent = "";
  $("next").classList.add("hidden");
  $("next").textContent = current === questions.length - 1 ? "Ver resultado" : "Próxima";
  const box = $("options");
  box.innerHTML = "";
  item.options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.textContent = text;
    b.onclick = () => choose(i);
    box.appendChild(b);
  });
}

function choose(i) {
  if (answered) return;
  answered = true;
  const item = questions[order[current]];
  const buttons = $("options").children;
  [...buttons].forEach(b => b.disabled = true);
  buttons[item.answer].classList.add("correct");
  if (i === item.answer) {
    score++;
    $("feedback").textContent = "✅ Resposta correta!";
  } else {
    buttons[i].classList.add("wrong");
    $("feedback").textContent = "❌ Resposta incorreta.";
  }
  $("next").classList.remove("hidden");
}

function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("score").textContent = `${score} / ${questions.length}`;
  $("msg").textContent =
    score === 10 ? "🏆 Perfeito! Você é um craque das Copas!" :
    score >= 7 ? "👏 Muito bem! Você manja de Copa do Mundo." :
    score >= 4 ? "🙂 Bom jogo, mas dá para melhorar." :
    "😅 Vale rever a Copa de 2022 e tentar de novo!";
}

$("next").onclick = () => {
  current++;
  current < questions.length ? show() : finish();
};

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  $("theme").textContent = t === "dark" ? "☀️ Modo normal" : "🌙 Modo dark";
  $("theme").setAttribute("aria-label", t === "dark" ? "Alternar para o modo normal" : "Alternar para o modo dark");
}
$("theme").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("theme", t);
  applyTheme(t);
};
applyTheme(document.documentElement.dataset.theme);
$("restart").onclick = start;
start();
</script>
</body>
</html>
